name: Sincronizar versiones de pteron

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pteron-release-published]
  schedule:
    # GitHub advierte que el inicio de cada hora concentra carga y puede
    # retrasar o descartar ejecuciones programadas. Se mantiene el intervalo
    # de 15 minutos, desplazado fuera de esos minutos de mayor congestión.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-pteron-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Leer releases y actualizar la web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTERON_STABLE_VERSION: ${{ vars.PTERON_STABLE_VERSION }}
        run: node scripts/update-pteron-releases.mjs
      - name: Publicar cambios
        run: |
          if git diff --quiet -- docs/data/releases.json; then
            echo "No hay cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/releases.json
          git commit -m "docs: actualiza versiones publicadas"
          git pull --rebase origin main
          git push origin HEAD:main
