<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — pteron</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px}.not-found img{width:120px;margin:0 auto 22px}.not-found h1{font-size:clamp(70px,15vw,150px);line-height:.8}.not-found h2{font-family:var(--serif);font-size:34px;font-weight:500;margin-top:28px}.not-found p{color:var(--muted);max-width:480px;margin:14px auto 25px}
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <img src="/assets/pteron-mark.png" alt="Logo de pteron">
      <h1>404</h1>
      <h2>Esta ruta no está en la carpeta.</h2>
      <p>La página que buscas no existe o cambió de ubicación.</p>
      <a class="button" href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
