<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<!-- Tarjeta para compartir (1200 × 630). scripts/og.mjs la abre con ?titulo=&linea=&nota=&lineas=&lamina= y le pone el
     reverso de la lámina (la figura que pteron dibuja para ella). Lo que se lee va en el cuadrado del centro (285 a 915 px):
     WhatsApp y otras aplicaciones recortan la vista previa chica a ese cuadrado. A 300 px de ancho, la marca mide 30 px de
     alto, el mínimo de /marca. -->
<link rel="stylesheet" href="/styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--mesa)}
  .tarjeta{position:relative;width:1200px;height:630px;overflow:hidden}
  .centro{position:absolute;left:325px;top:60px;bottom:64px;width:550px;display:flex;flex-direction:column;gap:40px}
  .centro .marca{font-size:120px;margin:0}
  .texto{display:grid;gap:18px;margin-top:auto}
  .titulo{margin:0;color:var(--azul);font-size:104px;font-weight:780;font-stretch:118%;letter-spacing:-.03em;line-height:.95;text-wrap:balance}
  .linea{margin:0;color:var(--tinta);font-size:40px;font-weight:560;line-height:1.22;text-wrap:balance}
  .nota{margin:0;color:var(--grafito);font-size:26px;font-weight:560;line-height:1.3}
  .nota:empty{display:none}
  /* A los lados, la lámina y su reverso: decoran y pueden quedar fuera del recorte cuadrado */
  .cara,.reverso{position:absolute;width:250px;aspect-ratio:1;filter:drop-shadow(0 1px 1px rgb(31 42 61/.3)) drop-shadow(14px 22px 18px rgb(31 42 61/.24))}
  .cara{left:26px;top:178px;transform:rotate(-6deg)}
  .cara img{display:block;width:100%;height:100%}
  .reverso{left:924px;top:190px;transform:rotate(5deg)}
  .lamina-reverso{position:absolute;inset:0;display:grid;gap:3.5%;padding:5.5%;color:var(--tinta);container-type:inline-size}
  .lamina-reverso::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--hoja) 0%,var(--reverso) 100%)}
  .reverso-figura,.reverso-pie{position:relative}
  .reverso-figura{display:grid;place-items:center;min-width:0;min-height:0;padding:2%}
  .reverso-figura svg{width:100%;height:100%;max-height:100%}
  .reverso-pie{display:flex;flex-direction:column;justify-content:safe flex-end;min-width:0;min-height:0;overflow:hidden;margin:0;padding:0 2% 1%;
    font:600 clamp(10px,5.2cqi,15px)/1.2 "Outfit",sans-serif;color:var(--azul)}
  .reverso-pie span{display:block;margin-top:.3em;font:500 max(10.5px,.8em)/1.25 var(--letra);font-stretch:94%;color:var(--grafito)}
  .reverso-pie.sin-credito span,.reverso-pie.sin-titulo>*{display:none}
  /* La esquina doblada: debajo asoma el azul */
  .oreja-og{position:absolute;right:0;top:0;width:92px;height:92px}
  .oreja-og i{position:absolute;inset:0;background:var(--azul);clip-path:polygon(0 0,100% 0,100% 100%)}
  .oreja-og b{position:absolute;inset:0;clip-path:polygon(0 0,100% 100%,0 100%);background:linear-gradient(225deg,#fff 50%,#F3F6FA 72%,#DCE3EC 100%);
    filter:drop-shadow(-4px 6px 6px rgb(31 42 61/.2))}
</style>
</head>
<body>
<div class="tarjeta">
  <div class="centro">
    <span class="marca"><svg viewBox="0 0 2872 886" aria-hidden="true"><use href="/assets/marca.svg#pteron"/></svg></span>
    <div class="texto">
      <h1 class="titulo" id="titulo"></h1>
      <p class="linea" id="linea"></p>
      <p class="nota" id="nota"></p>
    </div>
  </div>
  <div class="cara" id="cara"></div>
  <div class="reverso" id="reverso"></div>
  <span class="oreja-og" aria-hidden="true"><i></i><b></b></span>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const titulo = document.getElementById("titulo");
  titulo.textContent = q.get("titulo") || "";
  document.getElementById("linea").textContent = q.get("linea") || "";
  document.getElementById("nota").textContent = q.get("nota") || "";
  const lamina = q.get("lamina");
  if (lamina) document.getElementById("cara").innerHTML = `<img src="/assets/atlas/${lamina}-600.webp" alt="">`;
  const lineas = Number(q.get("lineas")) || 2;
  const ANCHO = 550;

  // og.mjs pone el reverso y después llama a armar(): el título se achica hasta caber en su ancho y en sus líneas (cada
  // palabra entera), y el pie del reverso pierde primero el crédito y después el título si no cabe en su celda. Se mide
  // con las letras ya cargadas: con las de reemplazo el ancho sería otro.
  window.armar = async () => {
    await Promise.all([document.fonts.load('780 100px "Archivo"'), document.fonts.load('600 20px "Outfit"'), document.fonts.ready]);
    const palabraCabe = () => titulo.textContent.split(" ").every((word) => {
      const probe = document.createElement("span");
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:inherit;font-stretch:inherit;letter-spacing:inherit";
      probe.textContent = word;
      titulo.append(probe);
      const ancho = probe.offsetWidth;
      probe.remove();
      return ancho <= ANCHO;
    });
    // Y entre la marca y el texto queda siempre aire: si no cabe todo en el cuadrado, el título se achica
    const centro = document.querySelector(".centro");
    let size = 104;
    while (size > 48 && (titulo.scrollWidth > ANCHO || titulo.offsetHeight > size * 0.95 * lineas + 4 || !palabraCabe() || centro.scrollHeight > centro.clientHeight + 1)) {
      size -= 2;
      titulo.style.fontSize = `${size}px`;
    }
    document.querySelectorAll(".reverso-pie").forEach((pie) => {
      const desborda = () => pie.scrollHeight > pie.clientHeight + 1 || pie.scrollWidth > pie.clientWidth + 1;
      if (desborda()) pie.classList.add("sin-credito");
      if (desborda()) pie.classList.add("sin-titulo");
    });
    document.body.dataset.listo = "";
  };
</script>
</body>
</html>
